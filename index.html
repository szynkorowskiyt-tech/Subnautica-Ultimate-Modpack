<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support Center</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1e1e2f, #3a0d0d);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .container {
            width: 90%;
            max-width: 950px;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(15px);
            border-radius: 25px;
            padding: 60px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.15);
        }

        h1 {
            font-size: clamp(45px, 8vw, 90px);
            margin-bottom: 20px;
            background: linear-gradient(90deg, #ff4b4b, #ffb3b3);
            -webkit-background-clip: text;
            color: transparent;
        }

        .subtitle {
            font-size: 25px;
            color: rgba(255,255,255,0.7);
            margin-bottom: 50px;
        }

        .buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
        }

        .button {
            text-decoration: none;
            color: white;
            background: rgba(255,255,255,0.12);
            padding: 20px 40px;
            border-radius: 18px;
            font-size: 25px;
            transition: 0.3s;
            border: 1px solid rgba(255,255,255,0.15);
            cursor: pointer;
        }

        .button:hover {
            transform: translateY(-7px);
            background: rgba(255,255,255,0.25);
            box-shadow: 0 0 20px rgba(255,255,255,0.2);
        }

        .downloads-counter {
            margin-top: 40px;
            padding: 15px 30px;
            display: inline-block;
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            font-size: 22px;
            color: rgba(255,255,255,0.8);
            border: 1px solid rgba(255,255,255,0.15);
            transition: 0.3s;
        }

        .downloads-counter:hover {
            background: rgba(255,255,255,0.2);
            transform: translateY(-3px);
        }

        #downloadCount {
            color: #ff7777;
            font-weight: bold;
        }

        footer {
            margin-top: 50px;
            color: rgba(255,255,255,0.5);
            font-size: 15px;
        }
    </style>
</head>


<body>

<div class="container">

    <h1>
        Welcome
    </h1>


    <p class="subtitle">
        Official Support Center
    </p>


    <div class="buttons">
      
        <a class="button" href="wiki/">
            WIKI
        </a>

        <a class="button" href="faq.html">
            FAQ
        </a>


        <a class="button" href="about.html">
            About
        </a>


        <a class="button" href="https://github.com/szynkorowskiyt-tech/Subnautica-Ultimate-Modpack">
            GitHub
        </a>
        <a class="button" href="#" onclick="downloadClick(event)">
            Download
        </a>

    </div>


    <div class="downloads-counter">
        Downloads: <span id="downloadCount">0</span>
    </div>


    <footer>
        © 2026 LeysMC
    </footer>

</div>



<script>

async function downloadClick(event) {

    event.preventDefault();


    try {

        await fetch("scripts/download.php", {
            method: "POST"
        });

    } catch (error) {

        console.log(error);

    }


    window.location.href = "downloads/";

}



fetch("scripts/read.php")

.then(response => response.text())

.then(data => {

    document.getElementById("downloadCount").textContent = data;

})

.catch(error => {

    console.log(error);

});


</script>


</body>
</html>
