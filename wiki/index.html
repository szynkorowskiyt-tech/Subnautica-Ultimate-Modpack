<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wiki</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1e1e2f, #3a0d0d);
            color: white;
            padding: 50px 20px;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: auto;

            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(15px);

            border-radius: 25px;
            padding: 50px;

            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        h1 {
            text-align: center;
            font-size: clamp(40px, 8vw, 80px);
            margin-bottom: 15px;

            background: linear-gradient(90deg, #ff4b4b, #ff9a9a);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .description {
            text-align: center;
            color: rgba(255, 255, 255, 0.65);
            font-size: 18px;
            margin-bottom: 50px;
        }

        .section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 32px;
            color: #ff7777;
            margin-bottom: 20px;
        }

        .wiki-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
        }

        /*
        ========================================
        WIKI BUTTON
        ========================================
        */

        .wiki-item {
            width: 100%;
            text-align: left;

            background: rgba(255, 255, 255, 0.1);

            padding: 25px;

            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.05);

            cursor: pointer;

            color: white;

            transition: 0.3s;
        }

        .wiki-item:hover {
            transform: translateY(-5px);

            background: rgba(255, 255, 255, 0.18);

            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .wiki-item:active {
            transform: translateY(-2px);
        }

        .wiki-item span {
            display: block;

            color: #7db8ff;

            font-size: 23px;
            font-weight: bold;

            transition: 0.3s;
        }

        .wiki-item:hover span {
            color: #ffffff;
        }

        .wiki-item p {
            margin-top: 10px;

            color: rgba(255, 255, 255, 0.6);

            font-size: 15px;
            line-height: 1.5;
        }

        /*
        ========================================
        FOOTER
        ========================================
        */

        footer {
            margin-top: 50px;
            padding-top: 25px;

            border-top: 1px solid rgba(255, 255, 255, 0.1);

            text-align: center;

            color: rgba(255, 255, 255, 0.5);

            font-size: 14px;
        }

        /*
        ========================================
        MOBILE
        ========================================
        */

        @media (max-width: 600px) {

            body {
                padding: 20px 10px;
            }

            .container {
                width: 100%;
                padding: 30px 20px;
            }

            .section-title {
                font-size: 26px;
            }

            .wiki-item span {
                font-size: 20px;
            }

        }
    </style>
</head>

<body>

    <div class="container">

        <h1>
            Wiki
        </h1>

        <p class="description">
            Welcome to the Wiki. Here you can find useful information,
            guides and documentation.
        </p>


        <!-- ========================================
             GETTING STARTED
        ========================================= -->

        <div class="section">

            <h2 class="section-title">
                Getting Started
            </h2>

            <div class="wiki-grid">

                <button
                    class="wiki-item"
                    onclick="window.location.href='https://subnautica-new-age.fandom.com/wiki/Subnautica:_New_Age_Wiki'"
                >
                    <span>
                        Fan's made wiki
                    </span>

                    <p>
                        Wiki made by fans for fans!
                    </p>
                </button>

                <button
                    class="wiki-item"
                    onclick="window.location.href='https://subnauticamodding.wiki.gg/wiki/Category:The_Red_Plague'"
                >
                    <span>
                        The Red Plague Wiki
                    </span>

                    <p>
                        Wiki of new virus
                    </p>
                </button>

                <button
                    class="wiki-item"
                    onclick="window.location.href='https://aotu.fandom.com/wiki/Return_of_the_Ancients'"
                >
                    <span>
                        Return of the ancients wiki
                    </span>

                    <p>
                        Wiki of gargantuan leviathan
                    </p>
                </button>

                <button
                    class="wiki-item"
                    onclick="window.location.href='https://subnautica-mod-creatures.net/mod/prototype'"
                >
                    <span>
                        The Prototype Wiki
                    </span>

                    <p>
                        The Prototype submarine wiki
                    </p>
                </button>

                <button
                    class="wiki-item"
                    onclick="window.location.href='getting_started/first_steps.html'"
                >
                    <span>
                        First Steps
                    </span>

                    <p>
                        A guide for new users to get started.
                    </p>
                </button>

            </div>

        </div>


        <!-- ========================================
             GUIDES
        ========================================= -->

        <div class="section">

            <h2 class="section-title">
                Guides
            </h2>

            <div class="wiki-grid">


                <button
                    class="wiki-item"
                    onclick="window.location.href='guides/installation.html'"
                >
                    <span>
                        Installation
                    </span>

                    <p>
                        Learn how to install and set up the project.
                    </p>
                </button>


                <button
                    class="wiki-item"
                    onclick="window.location.href='guides/updates.html'"
                >
                    <span>
                        Updates
                    </span>

                    <p>
                        Learn how to update the project safely.
                    </p>
                </button>

            </div>

        </div>


        <!-- ========================================
             TROUBLESHOOTING
        ========================================= -->


        <!-- ========================================
             FOOTER
        ========================================= -->

        <footer>
            © 2026 LeysMC
        </footer>

    </div>

</body>
</html>
