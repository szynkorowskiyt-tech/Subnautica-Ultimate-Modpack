<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>First Steps - Wiki</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;

            background: linear-gradient(135deg, #1e1e2f, #3a0d0d);

            display: flex;
            justify-content: center;
            align-items: center;

            color: white;

            padding: 30px 20px;
        }

        .container {
            width: 90%;
            max-width: 900px;

            background: rgba(255, 255, 255, 0.08);

            backdrop-filter: blur(15px);

            border-radius: 25px;

            padding: 55px;

            text-align: center;

            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);

            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        h1 {
            font-size: clamp(45px, 8vw, 80px);

            margin-bottom: 30px;

            background: linear-gradient(
                90deg,
                #ff4b4b,
                #ffb3b3
            );

            -webkit-background-clip: text;
            background-clip: text;

            color: transparent;
        }

        .text {
            font-size: 22px;

            line-height: 1.6;

            color: rgba(255, 255, 255, 0.85);

            margin-bottom: 40px;
        }

        .info {
            background: rgba(255, 255, 255, 0.1);

            padding: 25px;

            border-radius: 18px;

            margin-bottom: 35px;

            font-size: 20px;
        }

        .info p {
            margin: 10px;
        }

        /*
        ========================================
        BACK BUTTON
        ========================================
        */

        .back-button {
            padding: 15px 35px;

            border-radius: 15px;

            background: rgba(255, 255, 255, 0.12);

            color: #7db8ff;

            border: none;

            font-size: 24px;

            cursor: pointer;

            transition: 0.3s;
        }

        .back-button:hover {
            transform: translateY(-5px);

            background: rgba(255, 255, 255, 0.25);

            color: white;
        }

        .back-button:active {
            transform: translateY(-2px);
        }

        footer {
            margin-top: 35px;

            color: rgba(255, 255, 255, 0.5);

            font-size: 14px;
        }

        /*
        ========================================
        MOBILE
        ========================================
        */

        @media (max-width: 600px) {

            body {
                padding: 20px 10px;
            }

            .container {
                width: 100%;

                padding: 35px 20px;
            }

            .text {
                font-size: 18px;
            }

            .info {
                font-size: 17px;
            }

            .back-button {
                font-size: 20px;

                padding: 12px 30px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>
            First Steps
        </h1>

        <p class="text">
            This is a test page for the Wiki.
            Here you can add information, guides,
            instructions and other useful content.
        </p>

        <div class="info">

            <p>
                1. Open quests.html file
            </p>

            <p>
                2. do quests!
            </p>

        </div>

        <button
            class="back-button"
            onclick="window.location.href='../index.html'"
        >
            Back
        </button>

        <footer>
            © 2026 LeysMC
        </footer>

    </div>

</body>
</html>
